<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surdas Caretaker Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .log-container {
            height: 400px;
            overflow-y: auto;
            scrollbar-width: thin;
        }
    </style>
</head>
<body class="bg-gray-100 font-sans h-screen flex flex-col">

    <nav class="bg-blue-600 text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="text-2xl font-bold">Surdas Vision System - Caretaker Dashboard</h1>
        <div class="flex space-x-4">
            <span id="status-indicator" class="flex items-center text-sm font-medium">
                <span class="w-3 h-3 bg-green-500 rounded-full mr-2"></span> System Online
            </span>
        </div>
    </nav>

    <main class="flex-grow p-6 flex flex-col lg:flex-row gap-6 max-w-7xl mx-auto w-full">
        <!-- Left Column: Video Feed & Controls -->
        <div class="lg:w-2/3 flex flex-col gap-6">
            <div class="bg-white rounded-lg shadow-md p-4">
                <h2 class="text-xl font-semibold mb-4 border-b pb-2 text-gray-700">Live Camera Feed</h2>
                <div class="bg-black rounded-md overflow-hidden flex justify-center aspect-video relative">
                    <img id="video-stream" src="/video_feed" alt="Camera Feed" class="object-contain w-full h-full">
                </div>
            </div>

            <div class="bg-white rounded-lg shadow-md p-4">
                <h2 class="text-xl font-semibold mb-4 border-b pb-2 text-gray-700">System Controls</h2>
                <div class="flex gap-4">
                    <button onclick="control('toggle_nav')" class="px-4 py-2 bg-indigo-500 hover:bg-indigo-600 text-white rounded-md transition">NAV Mode</button>
                    <button onclick="control('toggle_ocr')" class="px-4 py-2 bg-teal-500 hover:bg-teal-600 text-white rounded-md transition">OCR Mode</button>
                    <button onclick="control('toggle_led')" class="px-4 py-2 bg-yellow-500 hover:bg-yellow-600 text-white rounded-md transition">Toggle Flashlight</button>
                </div>
            </div>
        </div>

        <!-- Right Column: Logs & Status -->
        <div class="lg:w-1/3 flex flex-col gap-6">
            <div class="bg-white rounded-lg shadow-md p-4">
                <h2 class="text-xl font-semibold mb-4 border-b pb-2 text-gray-700">Current Status</h2>
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-gray-50 p-3 rounded border">
                        <span class="block text-xs text-gray-500 uppercase">Mode</span>
                        <span id="stat-mode" class="font-bold text-lg text-blue-600">--</span>
                    </div>
                    <div class="bg-gray-50 p-3 rounded border">
                        <span class="block text-xs text-gray-500 uppercase">Flashlight</span>
                        <span id="stat-led" class="font-bold text-lg text-gray-700">--</span>
                    </div>
                    <div class="bg-gray-50 p-3 rounded border col-span-2">
                        <span class="block text-xs text-gray-500 uppercase">Wall Detection</span>
                        <span id="stat-wall" class="font-bold text-lg text-gray-700">--</span>
                    </div>
                    <div class="bg-gray-50 p-3 rounded border col-span-2">
                        <span class="block text-xs text-gray-500 uppercase">Closest Obstacle / Alert</span>
                        <span id="stat-closest" class="font-bold text-sm text-red-600 min-h-[1.5rem]">--</span>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-lg shadow-md p-4 flex-grow flex flex-col">
                <h2 class="text-xl font-semibold mb-4 border-b pb-2 text-gray-700">Event Logs</h2>
                <div id="log-box" class="log-container bg-gray-900 text-green-400 font-mono text-sm p-4 rounded flex-grow">
                    <!-- Logs will be inserted here -->
                </div>
            </div>
        </div>
    </main>

    <script>
        const logBox = document.getElementById('log-box');
        
        async function fetchLogs() {
            try {
                const response = await fetch('/logs');
                const data = await response.json();
                
                // Update stats
                document.getElementById('stat-mode').innerText = data.mode;
                document.getElementById('stat-led').innerText = data.led_on ? 'ON' : 'OFF';
                
                const wallEl = document.getElementById('stat-wall');
                if (data.wall_detected) {
                    wallEl.innerText = '⚠️ WALL DETECTED';
                    wallEl.className = 'font-bold text-lg text-red-600';
                } else {
                    wallEl.innerText = 'Clear';
                    wallEl.className = 'font-bold text-lg text-green-600';
                }
                
                document.getElementById('stat-closest').innerText = data.closest_obstacle || 'None';
                
                // Update logs
                logBox.innerHTML = '';
                data.logs.forEach(log => {
                    const div = document.createElement('div');
                    div.innerText = log;
                    div.className = 'mb-1 border-b border-gray-800 pb-1';
                    logBox.appendChild(div);
                });
                
                // Auto scroll to bottom
                logBox.scrollTop = logBox.scrollHeight;
                
            } catch (err) {
                console.error("Error fetching logs:", err);
            }
        }

        async function control(action) {
            try {
                await fetch('/control/' + action);
                fetchLogs(); // refresh immediately
            } catch (err) {
                console.error("Error sending control:", err);
            }
        }

        // Poll logs every 1 second
        setInterval(fetchLogs, 1000);
        fetchLogs();
    </script>
</body>
</html>
